[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-scanner"
description = "Linux Wi-Fi scanner using NetworkManager with customtkinter GUI"
version = "1.0.0"
authors = [{name = "Guido DiPilla"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
]
keywords = ["wifi", "scanner", "networkmanager", "linux", "gui"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.0.0",
    "mutmut>=3.5.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/Guido-DiPilla/wifi_scanner"
Repository = "https://github.com/Guido-DiPilla/wifi_scanner.git"
Issues = "https://github.com/Guido-DiPilla/wifi_scanner/issues"

[tool.mutmut]
# Keep pilot scope tight so mutation runs remain practical on developer machines.
paths_to_mutate = ["wifi_core/nmcli_parser.py"]
also_copy = ["wifi_core/", "config.py", "VERSION"]
tests_dir = ["tests/test_nmcli_parser.py"]
pytest_add_cli_args_test_selection = [
  "tests/test_nmcli_parser.py",
]
pytest_add_cli_args = ["-q", "--no-cov"]
